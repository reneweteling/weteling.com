      hero:
        title: "Home"
        kicker: "Hoi, ik ben René"
        headline: "Eén developer.<br>Een vloot agents."
        lead: "Ik orchestreer AI agents die ontwerpen, coderen, testen en shippen, en ik bewaak met mijn engineering-ervaring dat ze het goed doen. <a href=\"#apps\" class=\"hero-link\">TidyDrive</a> ging in één dag van schets naar een getekende, genotariseerde release."
        pitch: "Die snelheid ook voor jouw product? Van idee naar productie, CTO as a service, of een tweede paar senior ogen."
        say_hello: "Start een Project"
        view_work: "Bekijk Werk"
        stats:
          experience: "jaar software geleverd"
          projects: "projecten opgeleverd"
          one_contact: "aanspreekpunt"

      services:
        title: "Diensten"
        subtitle: "Eén aanspreekpunt voor je hele project. Van de eerste architectuurschets tot een draaiende app in productie."
        delivery:
          h3: "Van idee tot productie"
          service-description: "Jij hebt een idee en een design, ik lever de rest. Architectuur, back-end, front-end, infra en deployment, allemaal uit één hand. Solo voor het hele project, of als senior versterking die zijn kennis in je bestaande team brengt."
        caas:
          h3: "CTO as a Service"
          service-description: "Technisch leiderschap nodig zonder een fulltime CTO aan te nemen? Ik overbrug de kloof tussen bedrijfsdoelen en technologie — van architectuurkeuzes en vendor selectie tot technische strategie."
        duck:
          h3: "Sparringpartner"
          service-description: "Soms heb je gewoon een senior engineer nodig om mee te sparren. Met een bakkie koffie bespreken we je architectuur, tech-keuzes en uitdagingen. Vrijblijvend."
        agentic:
          h3: "Agentic Engineer"
          service-description: "Een compleet MVP in recordtijd. Ik werk met agentic teams van AI-agents die parallel bouwen, testen en reviewen, aangestuurd door mijn engineering-ervaring. Zo zet je in dagen neer waar normaal weken voor staan, zonder in te leveren op kwaliteit."
        ai:
          h3: "AI Integratie"
          service-description: "Van AI-tools voor developers tot het integreren van LLM's in je product — ik help teams om AI effectief in te zetten. Developer productiviteit of klantgerichte features, ik pak het hands-on aan."

      skills:
        title: "Vaardigheden"
        headline: "Eerst alles met de hand."
        subtitle: "Vroeger deden we alles nog zelf. Twintig jaar back-ends, front-ends en servers: elke query, elke deploy, elke storing om 3 uur 's nachts. Dat is mijn fundament, en daarom kan ik agents de juiste kant op laten rennen. Ik weet hoe goed eruitziet, dus ik zie het meteen als ze afdwalen."
        be:
          title: "Back-End Ontwikkeling"
          description: "Voordat agents code schreven, bouwde ik de API's, integraties, jobs en zoekfuncties zelf. Daardoor weet ik welke architectuur standhoudt en welke shortcut je later opbreekt, en daar stuur ik de agents op."
          tags:
