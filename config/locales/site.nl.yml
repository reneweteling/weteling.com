          title: "Front-End Ontwikkeling"
          description: "Ik heb interfaces met de hand gebouwd in elk framework van de afgelopen vijftien jaar. Nu schrijven agents de componenten, en zorg ik dat ze functioneel, consistent en snel zijn."
