      services:
        title: "Services"
        subtitle: "One point of contact for your whole project. From the first architecture sketch to a running app in production."
        delivery:
          h3: "From idea to production"
          service-description: "You bring the idea and the design, I deliver the rest. Architecture, back-end, front-end, infra and deployment, all from one hand. Solo for the whole project, or as senior reinforcement bringing that knowledge into your existing team."
        caas:
          h3: "CTO as a Service"
          service-description: "Need technical leadership without the full-time hire? I bridge the gap between business goals and technology, guiding your team through architecture decisions, vendor selection, and technical strategy."
        duck:
          h3: "Sparring Partner"
          service-description: "Sometimes you need a senior engineer to bounce ideas off. Over a cup of coffee, we'll go through your architecture, tech choices, and challenges. No strings attached."
        agentic:
          h3: "Agentic Engineer"
          service-description: "A complete MVP in record time. I run agentic teams of AI agents that build, test, and review in parallel, steered by my engineering experience. You ship in days what normally takes weeks, without trading away quality."
        ai:
          h3: "AI Integration"
          service-description: "From code-assisting AI tools to integrating LLMs into your product — I help teams adopt AI effectively. Whether it's developer productivity or customer-facing AI features, I've been doing it hands-on."

      skills:
        title: "Skills"
        headline: "Built by hand, first."
        subtitle: "Back in the day we did everything ourselves. Twenty years of back-ends, front-ends and servers: every query, every deploy, every outage at 3 AM. That is my foundation, and it's why I can send agents running in the right direction. I know what good looks like, so I see it the moment they drift."
        be:
          title: Back-End Development
          description: "Before agents wrote code, I built the APIs, integrations, jobs and search myself. So I know which architecture holds up and which shortcut comes back to bite you, and that is what I steer the agents on."
