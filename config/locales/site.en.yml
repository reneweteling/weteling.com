        kicker: "Hi, I'm René"
        headline: "One developer.<br>A fleet of agents."
        lead: "I orchestrate AI agents that design, code, test and ship, and I bring the engineering judgement that keeps them honest. <a href=\"#apps\" class=\"hero-link\">TidyDrive</a> went from a sketch to a signed, notarized release in a single day."
